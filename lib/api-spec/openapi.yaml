        class_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        attendance_status: { type: string }
        joined_at: { type: string, format: date-time }
      required: [id, attendance_status]
    ClassInput:
      type: object
      properties:
        gym_id: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        sport_type: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
        scheduled_at: { type: string, format: date-time }
        duration_minutes: { type: integer, minimum: 1 }
        capacity: { type: integer, minimum: 1 }
        price: { type: integer, minimum: 0 }
        image_url: { type: [string, "null"] }
        status: { type: string, enum: [draft, published, completed, cancelled] }
        age_band:
          type: string
          enum: ["20_25", "26_35", "36_45"]
