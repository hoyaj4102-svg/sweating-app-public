        body: { type: string }
        published_at: { type: string, format: date-time }
        notice_version: { type: string }
        is_current: { type: boolean }
        acknowledged_at: { type: [string, "null"], format: date-time }
      required: [kind, title, body, published_at, notice_version, is_current, acknowledged_at]
    MessageInbox:
      type: object
