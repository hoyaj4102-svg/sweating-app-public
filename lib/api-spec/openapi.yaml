      required: [notice_version]
    PrinciplesAcknowledgement:
      type: object
      properties:
        notice_version: { type: string }
        acknowledged_at: { type: string, format: date-time }
      required: [notice_version, acknowledged_at]
    OwnerNoticeInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 8000 }
      required: [title, body]
    OwnerNoticeResponse:
      type: object
      properties:
        announcement:
          $ref: "#/components/schemas/Announcement"
      required: [announcement]
    OwnerRosterEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        attendance_status: { type: string }
        display_name: { type: [string, "null"] }
      required: [id, user_id, attendance_status]
    OwnerAttendanceResult:
